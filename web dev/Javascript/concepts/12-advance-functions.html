<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance Functions</title>
</head>
<body> 

  <button onclick="" class="js-button">click</button>
  <script>

    const buttonElement = document.querySelector('.js-button');

    const eventListener = () => {
      console.log('Button clicked');
    }

    buttonElement.addEventListener('click', eventListener);

    buttonElement.removeEventListener('click', eventListener);

    buttonElement.addEventListener('click', () => {
      console.log('Button2 clicked');
    });
    
    buttonElement.addEventListener('click', () => {
      console.log('Button3 clicked');
    });

    const func1 = function greeting() {
      console.log('Hello');
    }
    console.log(func1);

    setTimeout(function() {
      console.log('hellooo');
    }, 3000);

    //Hoisting
    greeting();
    function greeting() {
      console.log('Hello');
    }


    // Function inside an object
    const object = {
      num: 2,
      fun: function() {
        console.log('Hello3');
      }
    }

    object.fun();

    // Passing value into a function 

    function display (param) {
      console.log(param);
    }
    display(2);

    // passing function inside a function 

    function run (param) {
      param();
    }
    run(function() {
      console.log('Hello5')
    });

    // Arrow functions

    const oneline = () => 2+3;
    console.log(oneline());

  </script>
</body>
</html>
