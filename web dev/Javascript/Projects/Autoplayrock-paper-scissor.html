<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissor</title>
  <link 
  rel="stylesheet" 
  href="styles/Autoplay-rock-paper-scissor copy.css">
</head>

<body>

  <h1>Rock Paper Scissor</h1>

  <!--
    1. Computer will randomly select a move.
    2. Compare the moves to get a result.
    3. Display the result in popup.
  -->

  <button class="design-button" onclick="
    playGame('rock');
  "><img src="images/rock-emoji.png" alt="rock" class="design-icon"></button>

  <button class="design-button" onclick="
    playGame('paper');
  "><img src="images/paper-emoji.png" alt="paper" class="design-icon"></button>

  <button class="design-button" onclick="
    playGame('scissor');
  "><img src="images/scissor-emoji.png" alt="scissor" class="design-icon"></button>


  <p class="js-result result"></p>
  <p class="js-moves">
    
  </p>
  <p class="js-score score"></p>

  <button class="reset-score-button" onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;

    localStorage.removeItem('score');

    updateScoreElement();
  ">Reset Score</button>

  <button class="Auto-play-button" onclick="
  autoplay();
  ">Auto Play</button>


  <script src="scripts/Autoplay-rock-paper-scissor copy.js"></script>

</body>

</html>
