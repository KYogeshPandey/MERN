<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

    <style>
        table {
            border-collapse : collapse;
        }
        th, td {
            border:2px solid black;
            text-align: center;
        }
        th{
        background-color: rgb(237, 126, 126);
        }
        .yellow {background-color: rgb(244, 244, 109);}
        .purple {background-color: rgb(91, 84, 146);}
        .green {background-color: rgb(140, 236, 140);}
          
    </style>
</head>
<body>
    

    <table>

        <thead>
            <tr>
                <th rowspan="3">Day</th>
                <th rowspan="1" colspan="4">Seminar</th>
            </tr>
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="2" colspan="2">Topic</th>
            </tr>
            <tr>
                <th>Begin</th>
                <th>End</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Monday</td>
                <td rowspan="2" class="yellow">8:00am</td>
                <td rowspan="2" class="purple">5:00pm</td>
                <td colspan="2">Introduction to HTML</td>
            </tr>
            <tr>
                <td>Validity: DTD and Relax NG</td>
            </tr>
            <tr>
                <td rowspan="3">Tuesday</td>
                <td class="yellow">8:00am</td>
                <td class="yellow">11:00am</td>
                <td rowspan="2" colspan="2">XPath</td>
            </tr>
            <tr>
                <td class="yellow">11:00am</td>
                <td class="green">2:00pm</td>
            </tr>
            <tr>
                <td class="green">2:00pm</td>
                <td class="purple">5:00pm</td>
                <td rowspan="1" colspan="2">XSL Transformations</td>
            </tr>
            <tr>
                <td>Wednessday</td>
                <td class="yellow">8:00am</td>
                <td class="green">12:00pm</td>
                <td colspan="2">XSL Formatting Objects</td>
            </tr>
        </tbody>
        


    </table>
</body>
</html>
