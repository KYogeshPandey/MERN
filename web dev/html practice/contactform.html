<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us Form</title>
</head>
<body>
    <h1> Welcome to CodeHelp!</h1>
    <h2> Contact us Form</h2>
    <form action="will learn">
        <label for="name">Name</label>
        <input type="text" name="name"
         id="name"
         placeholder="Enter Your Name"><br>

        <label for="email">Email</label>
        <input type="email" name="email"
         id="email"
         placeholder="Enter Your Email"><br>

        <label for="contact">Contact</label>
        <input type="number" name="contact"
         id="contact"><br>

        <label for="gender">Gender</label>
        <select name="gender" id="gender">
        <option value="select">Select</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="Others">Others</option>
        </select><br>

        <label for="dob">Date of Birth</label>
        <input type="date" name="date" id="dob"><br>

        <span>Rating</span>
        <input type="radio" name="Rating" id="rating1" value="1">
        <label for="rating">1</label>
        <input type="radio" name="Rating" id="rating2" value="2">
        <label for="rating">2</label>
        <input type="radio" name="Rating" id="rating3" value="3">
        <label for="rating">3</label>
        <input type="radio" name="Rating" id="rating4" value="4">
        <label for="rating">4</label>
        <input type="radio" name="Rating" id="rating5" value="5">
        <label for="rating">5</label><br>

        <label for="msg">Enter Your Message</label><br>
        <textarea name="message" id="msg" cols="30" rows="5" placeholder="Write your message"></textarea>
        <br>

        <input type="submit" name="submit" id="submit" value="submit">
        <input type="reset" name="reset" id="reset" value="Reset">
